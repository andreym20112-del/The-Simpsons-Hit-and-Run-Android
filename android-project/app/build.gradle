plugins {
    id 'com.android.application'
}

// --- Ajustes para compilar en GitHub Actions (build de desarrollo) ---
// ABIs: por defecto las dos de siempre; con -PabiOnly=arm64-v8a solo una (build mas rapido)
def abis = project.hasProperty('abiOnly') ? [project.property('abiOnly')] : ['armeabi-v7a', 'arm64-v8a']
// Firma: si existe KEYSTORE_PATH en el entorno se firma con tu propia clave
def ksPath = System.getenv("KEYSTORE_PATH")

android {
    namespace = "org.libsdl.app"
    compileSdkVersion 35
    ndkVersion = "28.2.13676358"

    defaultConfig {
        applicationId "com.c4rlox.simpsons.dev"   // distinto del original: se instala a la vez, con su propia carpeta de datos
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 93
        versionName "0.93"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-24",
                        //"-DANDROID_STL=c++_static",
                        "-DANDROID_STL=c++_shared",
                        "-DANDROID=ON",
                        "-DSRR2_REGION=PAL" // si quitamos esta linea para que no sea PAL, el juego correra la rama NTSC ya que está por defecto
                abiFilters(*abis)

            }
        }


        //ndk {
            //noinspection ChromeOsAbiSupport
            //abiFilters 'armeabi-v7a', 'arm64-v8a'

       // }

    }

    // ✅ CAMBIO 1: Activar Prefab para poder consumir AARs con paquetes C/C++ (como com.fpliu...:ffmpeg)
    buildFeatures {
        prefab true
    }

    signingConfigs {
        if (ksPath) {
            dev {
                storeFile file(ksPath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (ksPath) { signingConfig signingConfigs.dev }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            jniDebuggable true
        }
        releaseWithLogs {
            initWith release
            debuggable true
            jniDebuggable true
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version "4.1.2"
            //version "3.27.8"
            //version "4.2.3"
        }
    }

    sourceSets {
        main {
            jniLibs.srcDir 'libs'
        }
    }

    packagingOptions {
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
    }

    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    //implementation 'com.github.tanersener:ffmpeg-kit:v4.5.LTS'
    implementation 'com.fpliu.ndk.pkg.prefab.android.21:ffmpeg:6.0'
}
# Coloca este archivo en:  .github/workflows/build-apk.yml  (en tu fork)
name: Build dev APK

on:
  workflow_dispatch:          # boton "Run workflow" en la pestana Actions
  push:
    branches: [ dev ]         # y cada push a la rama "dev"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar componentes del SDK de Android
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;4.1.2"

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar la clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Falta el secreto KEYSTORE_B64: el APK saldra sin firmar y no se podra instalar."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dev.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/dev.keystore" >> "$GITHUB_ENV"

      - name: Compilar (release, solo arm64-v8a)
        working-directory: android-project
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PabiOnly=arm64-v8a -Dorg.gradle.jvmargs=-Xmx4g --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: simpsons-dev-apk
          path: android-project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

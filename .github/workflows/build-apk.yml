# Coloca este archivo en:  .github/workflows/build-apk.yml  (en tu fork)
name: Build dev APK

on:
  workflow_dispatch:          # boton "Run workflow" en la pestana Actions
  push:
    branches: [ dev ]         # y cada push a la rama "dev"

jobs:
  build:
    runs-on: ubuntu-24.04     # fijo, para no depender del cambio de ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # La imagen ubuntu-24.04 ya trae el SDK de Android; se usa su sdkmanager
      # por ruta completa (no esta siempre en el PATH).
      - name: Instalar componentes del SDK de Android
        run: |
          SDKM="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          echo "Usando: $SDKM"
          ls -la "$SDKM"
          "$SDKM" --version
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;4.1.2"

      # La validacion de wrappers se desactiva: el repo trae un gradle-wrapper.jar
      # antiguo (Gradle 3.4, copia de SDL) que el validador no reconoce. Solo
      # lanza la descarga de gradle-8.12 indicada en gradle-wrapper.properties.
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Preparar la clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Falta el secreto KEYSTORE_B64: el APK saldra sin firmar y no se podra instalar."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dev.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/dev.keystore" >> "$GITHUB_ENV"

      - name: Compilar (release, solo arm64-v8a)
        working-directory: android-project
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PabiOnly=arm64-v8a -Dorg.gradle.jvmargs=-Xmx4g --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: simpsons-dev-apk
          path: android-project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
